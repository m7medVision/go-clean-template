syntax = "proto3";

package grpc.v1;

option go_package = "docs/proto/v1";

import "google/protobuf/field_mask.proto";

service TaskService {
  rpc CreateTask (CreateTaskRequest) returns (TaskResponse);
  rpc GetTask (GetTaskRequest) returns (TaskResponse);
  rpc ListTasks (ListTasksRequest) returns (ListTasksResponse);
  // Every user's tasks. Requires the admin role; anyone else gets PERMISSION_DENIED.
  rpc ListAllTasks (ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask (UpdateTaskRequest) returns (TaskResponse);
  rpc TransitionTask (TransitionTaskRequest) returns (TaskResponse);
  rpc DeleteTask (DeleteTaskRequest) returns (DeleteTaskResponse);
  // Sets the attributes the mask names (priority, estimate, labels) and leaves the rest. A path in
  // the mask whose field is unset clears it.
  rpc UpdateTaskAttributes (UpdateTaskAttributesRequest) returns (TaskResponse);
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
}

message GetTaskRequest {
  string id = 1;
}

message ListTasksRequest {
  string status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message UpdateTaskRequest {
  string id = 1;
  string title = 2;
  string description = 3;
}

message TransitionTaskRequest {
  string id = 1;
  string status = 2;
}

message DeleteTaskRequest {
  string id = 1;
}

message TaskAttributes {
  optional string priority = 1;
  optional double estimate = 2;
  repeated string labels = 3;
}

message UpdateTaskAttributesRequest {
  string id = 1;
  TaskAttributes attributes = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message TaskResponse {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  TaskAttributes attributes = 8;
}

message ListTasksResponse {
  repeated TaskResponse tasks = 1;
  int32 total = 2;
}

message DeleteTaskResponse {}
