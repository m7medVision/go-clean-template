name: Docs
# Publishes the docs site to GitHub Pages for every master commit whose CI passed, built from the
# commit CI checked.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# A newer deploy replaces an older one; a deploy in progress is never cut off.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: runner / docs / build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: site
          node-version-file: .node-version
          cache: true
      - name: Build
        run: make docs-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: runner / docs / deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
