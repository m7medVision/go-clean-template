name: CI
on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR cancels the run it supersedes. Runs on master always
# finish, so every merged commit is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stages: changes → lint → the checks, side by side → integration → ci-ok.
# Jobs inside one stage share nothing, so they run side by side; each stage
# waits for the one before it, so a cheap failure stops the expensive jobs
# from starting. `ci-ok` is the one check branch protection should require:
# a job skipped because its paths did not change counts as a pass.
jobs:
  changes:
    name: runner / changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }} # scaffold:web
      sqlc: ${{ steps.codegen.outputs.sqlc }}
      schema: ${{ steps.codegen.outputs.schema }}
    steps:
      - uses: actions/checkout@v7
      # Each filter lists what is safe to SKIP, so a path nobody thought
      # of runs the job. With predicate-quantifier: every, a file matches a
      # filter only when it matches every pattern.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - '**'
              - '!web/**' # scaffold:web
              - '!**/*.md'
            # scaffold:web:begin
            # Paths that cannot change docs/openapi/v1.json, the GraphQL
            # schema or web/.
            web:
              - '**'
              - '!**/*.md'
              - '!**/*_test.go'
              - '!internal/repo/**'
              - '!internal/usecase/**'
              - '!internal/app/schema/**'
              - '!internal/controller/grpc/**' # scaffold:grpc
              - '!internal/controller/worker/**' # scaffold:queue
              - '!docs/proto/**' # scaffold:grpc
              - '!cmd/worker/**' # scaffold:queue
              - '!integration-test/**'
              - '!Dockerfile'
              - '!docker-compose*.yml'
              - '!.golangci.yml'
            # scaffold:web:end
      # The drift check regenerates from exactly these inputs (any one).
      - uses: dorny/paths-filter@v4
        id: codegen
        with:
          filters: |
            sqlc:
              - 'internal/app/schema/**'
              - 'internal/repo/persistent/queries/**'
              - 'sqlc.yaml'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            schema:
              - 'internal/app/schema/**'
              - 'scripts/schema-roundtrip.sh'

  lint:
    name: runner / lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # reviewdog checks only the lines a pull request adds (the repo has
      # older findings), so these three have nothing to check on master.
      - uses: reviewdog/action-yamllint@v1
        if: github.event_name == 'pull_request'
        with:
          fail_level: error
          reporter: github-pr-review
          yamllint_flags: '-d "{extends: default, rules: {truthy: disable}}" .'
      - uses: reviewdog/action-hadolint@v1
        if: github.event_name == 'pull_request'
        with:
          fail_level: error
          reporter: github-pr-review
      - uses: dotenv-linter/action-dotenv-linter@v3
        if: github.event_name == 'pull_request'
        with:
          reporter: github-pr-review
      - uses: actions/setup-go@v7
        if: needs.changes.outputs.backend == 'true'
        with:
          go-version: '1.27'
          cache: false
      - name: golangci-lint
        if: needs.changes.outputs.backend == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=15m
      - name: Vulnerability scan
        if: needs.changes.outputs.backend == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck
          make deps-audit

  unit-tests:
    name: runner / tests / unit
    needs: [changes, lint]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      # The build cache holds test results too: with it restored, `go test`
      # reruns only the packages whose source, dependencies or test inputs
      # changed. Only master saves, so every PR starts from master's cache.
      - name: Cache key
        id: cache
        run: >-
          echo "prefix=go-test-$RUNNER_OS-${{ hashFiles('go.sum') }}"
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache.outputs.prefix }}-
            go-test-${{ runner.os }}-
      - name: Unit Tests
        run: make test
      # docs/openapi/v1.json is exported from the code, so a stale copy is drift.
      - name: OpenAPI document is current
        run: |
          make openapi
          git status --porcelain docs/openapi
          test -z "$(git status --porcelain docs/openapi)"
      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.prefix }}-${{ github.sha }}
      - name: Upload coverage report
        run: bash <(curl -s https://codecov.io/bash)

  sqlc-generated:
    name: runner / sqlc / generated code is current
    needs: [changes, lint]
    if: needs.changes.outputs.sqlc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: bmizerany/setup-postgres@0923a0e749e6648dfb69918e9cbc2dad41662196 # v4
        with:
          version: 18.6.0
      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | ATLAS_VERSION=v1.3.4 sh -s -- -y
      # yamllint disable rule:line-length
      - name: Regenerate
        run: make sqlc ATLAS_DEV_URL='postgres://postgres@localhost:5432/postgres?sslmode=disable'
      # yamllint enable rule:line-length
      - name: Fail on drift
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # Up from the base branch's schema, down to it, up again: catches an HCL
  # change Atlas cannot apply over the previous one, or cannot roll back
  # from. Pull requests only; the checkout is the PR merged into its base.
  schema-roundtrip:
    name: runner / schema / up and down
    needs: [changes, lint]
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
      # git archive needs only the base branch's tree, not its history.
      - name: Fetch the base branch
        run: >-
          git fetch --depth=1 origin
          "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
      - uses: bmizerany/setup-postgres@0923a0e749e6648dfb69918e9cbc2dad41662196 # v4
        with:
          version: 18.6.0
      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | ATLAS_VERSION=v1.3.4 sh -s -- -y
      # The runner's fresh postgres database is the throwaway target.
      - name: Round trip
        env:
          ROUNDTRIP_PG_URL: >-
            postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: make schema-roundtrip BASE_REF="origin/$BASE"

  # scaffold:web:begin
  # Also the OpenAPI drift check: `make web-api` re-exports
  # docs/openapi/v1.json first.
  web:
    name: runner / web / check + build
    needs: [changes, lint]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # Installs Vite+, the Node version in web/.node-version and bun, then
      # runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: web
          # Resolved relative to working-directory.
          node-version-file: .node-version
          cache: true
      - name: Regenerate OpenAPI document and REST types
        run: make web-api
      - name: Regenerate GraphQL types
        run: make web-graphql
      - name: Fail on drift
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Check
        run: make web-check
      - name: Build
        run: make web-build

  # scaffold:web:end
  integration-tests:
    name: runner / tests / integration
    needs: [changes, unit-tests]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      PGUSER: user
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: bmizerany/setup-postgres@0923a0e749e6648dfb69918e9cbc2dad41662196 # v4
        with:
          version: 18.6.0
      # scaffold:sso:begin
      # .env.example turns SSO on against this Keycloak; it boots while the rest of the job runs.
      # It listens on 8180 inside and out, so the issuer is keycloak.lvh.me:8180 everywhere.
      - name: Start Keycloak
        run: >-
          docker run -d --name keycloak -p 8180:8180 -p 9000:9000
          -e KC_HTTP_PORT=8180 -e KC_HOSTNAME=http://keycloak.lvh.me:8180 -e KC_HEALTH_ENABLED=true
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          -v "$PWD/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"
          quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm
      # scaffold:sso:end
      - name: Create the app database
        run: createdb db
      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | ATLAS_VERSION=v1.3.4 sh -s -- -y
      - name: Start the exchange-rate stub
        run: >-
          docker run -d --name exchange -p 8090:8090
          -v "$PWD/integration-test/exchange-stub/Caddyfile:/etc/caddy/Caddyfile:ro"
          -v "$PWD/internal/repo/webapi/testdata/openerapi_latest_omr.json:/srv/openerapi_latest_omr.json:ro"
          caddy:2.11.7-alpine
      - name: Build the app
        run: go build -tags migrate -o "$RUNNER_TEMP/app" ./cmd/app
      - name: Start the app
        run: |
          set -a && . ./.env.example && set +a
          export TRACING_ENABLED=false
          export EXCHANGE_SERVICE_URL=http://localhost:8090
          nohup "$RUNNER_TEMP/app" > "$RUNNER_TEMP/app.log" 2>&1 &
      # scaffold:queue:begin
      - name: Build and start the worker
        run: |
          go build -o "$RUNNER_TEMP/worker" ./cmd/worker
          set -a && . ./.env.example && set +a
          export TRACING_ENABLED=false
          nohup "$RUNNER_TEMP/worker" > "$RUNNER_TEMP/worker.log" 2>&1 &
      # scaffold:queue:end
      # scaffold:email:begin
      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.31.3
      # scaffold:email:end
      - name: Resolve the service hostnames to the runner
        run: |
          echo '127.0.0.1 app' | sudo tee -a /etc/hosts
          echo '127.0.0.1 mailpit' | sudo tee -a /etc/hosts # scaffold:email
          echo '127.0.0.1 keycloak.lvh.me' | sudo tee -a /etc/hosts # scaffold:sso
      # scaffold:sso:begin
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://localhost:9000/health/ready && exit 0
            sleep 2
          done
          echo "Keycloak did not become ready" >&2
          exit 1
      # scaffold:sso:end
      - name: Integration tests
        run: make integration-test
      - name: App log
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"
      # scaffold:queue:begin
      - name: Worker log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"
      # scaffold:queue:end
      # scaffold:email:begin
      - name: Mailpit log
        if: failure()
        run: docker logs mailpit
      # scaffold:email:end
      - name: Exchange stub log
        if: failure()
        run: docker logs exchange
      # scaffold:sso:begin
      - name: Keycloak log
        if: failure()
        run: docker logs keycloak
      # scaffold:sso:end

  # scaffold:self:begin
  # Every preset `make scaffold` offers, generated and put through its own
  # make pre-commit, so a marker or manifest mistake fails here rather than in
  # a new project. It runs on every change: a docs edit can break a marker.
  # The preset list must match scaffold/features.yaml (a unit test checks).
  scaffold:
    name: runner / scaffold / ${{ matrix.preset }}
    needs: [changes, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [api, api-grpc, fullstack, everything]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | ATLAS_VERSION=v1.3.4 sh -s -- -y
      - name: Install the Go tools
        run: go install tool
      # The fullstack and everything presets keep web/, whose check needs
      # Vite+, Node and bun.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: web
          node-version-file: .node-version
          cache: true
      - name: Generate and check
        run: make scaffold-check PRESET=${{ matrix.preset }}

  # scaffold:self:end
  ci-ok:
    name: runner / ci-ok
    needs:
      - changes
      - lint
      - unit-tests
      - sqlc-generated
      - schema-roundtrip
      - web # scaffold:web
      - integration-tests
      - scaffold # scaffold:self
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
