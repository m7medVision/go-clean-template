name: Release
# Every master commit whose CI passed gets a release when its commits call for
# one: a feat, fix or breaking change since the last tag
# (`make release-version`, svu). GoReleaser publishes it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # A dry run: prints the version and notes master would get, publishes nothing.
  workflow_dispatch:

# One release at a time, in order; a queued run is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: runner / release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # The commit CI checked, not whatever master is now.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          # Every commit and tag: the version is computed from the history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Name the version
        id: version
        run: |
          v=$(make --no-print-directory release-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # GoReleaser releases the tag on HEAD. The tag is never pushed: the API creates it on HEAD_SHA
      # (release.target_commitish in .goreleaser.yaml), and tags are never moved afterwards.
      - name: Tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag "$VERSION"
      - name: Publish
        if: steps.version.outputs.version != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Write the notes
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## $VERSION"
            echo
            cat dist/CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"
