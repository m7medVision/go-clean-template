version: 2

# Every ecosystem lands in one pull request, merged by dependabot-auto-merge.yml once CI is green.
multi-ecosystem-groups:
  all:
    schedule:
      interval: daily
      time: "02:00"

updates:
  - package-ecosystem: gomod
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: docker
    directories: ["/", "/caddy", "/integration-test"]
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: docker-compose
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
