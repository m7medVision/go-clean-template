version: 2

# Every ecosystem lands in one pull request, merged by dependabot-auto-merge.yml once CI is green.
multi-ecosystem-groups:
  all:
    schedule:
      interval: daily
      time: "02:00"

updates:
  - package-ecosystem: gomod
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: bun
    directory: "/web"
    patterns: ["*"]
    multi-ecosystem-group: all
    # Auto-merge is on, so wait out a freshly published (possibly compromised) release.
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories: ["/", "/caddy", "/integration-test"]
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: docker-compose
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all
