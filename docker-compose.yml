x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55%40w0rd@db:5432/db"
  # Atlas dev database, used to compute schema diffs; must stay empty
  ATLAS_DEV_URL: "postgres://user:myAwEsOm3pa55%40w0rd@atlas-dev:5432/dev?sslmode=disable"
  # gRPC
  GRPC_PORT: "8081"
  # Metrics
  METRICS_ENABLED: "true"
  # API docs (Huma serves /docs, /openapi.json, /openapi.yaml)
  DOCS_ENABLED: "true"
  # Tracing
  TRACING_ENABLED: "true"
  TRACING_OTLP_ENDPOINT: "jaeger:4317"
  TRACING_OTLP_INSECURE: "true"
  TRACING_SAMPLE_RATE: "1.0"  # DON'T set to 1.0 in production, use a lower value like 0.1 or 0.01
  # JWT
  JWT_SECRET: "your-secret-key-change-in-production"
  JWT_TOKEN_EXPIRY: "24h"


services:
  db:
    container_name: db
    image: postgres:18.6-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  # Dev database used by Atlas to compute schema diffs; must stay empty and
  # dedicated to Atlas (the app connects to it only for diff computation)
  atlas-dev:
    container_name: atlas-dev
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: "dev"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
    networks:
      app_network:
        aliases:
          - atlas-dev.lvh.me

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      app_network:
        aliases:
          - jaeger.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
      - atlas-dev
      - jaeger
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  caddy:
    container_name: caddy
    build:
      # The repository root, so the image can build web/ too; see caddy/Dockerfile.dockerignore.
      context: .
      dockerfile: caddy/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
      - jaeger
    networks:
      app_network:
        aliases:
          - caddy.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
