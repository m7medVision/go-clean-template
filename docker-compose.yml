x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  APP_BASE_URL: "http://localhost"
  # HTTP settings
  HTTP_PORT: "8080"
  TRUSTED_PROXY: "172.30.0.10"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55%40w0rd@db:5432/db"
  VALKEY_URL: "valkey://valkey:6379/0"
  MONGO_URL: "mongodb://user:mongoPa55w0rd@mongo:27017/app?authSource=admin"
  NATS_URL: "nats://nats:4222"
  # gRPC
  GRPC_PORT: "8081"
  # Metrics
  METRICS_ENABLED: "true"
  # API docs (Huma serves /docs, /openapi.json, /openapi.yaml)
  DOCS_ENABLED: "true"
  # Tracing
  TRACING_ENABLED: "true"
  TRACING_OTLP_ENDPOINT: "jaeger:4317"
  TRACING_OTLP_INSECURE: "true"
  TRACING_SAMPLE_RATE: "1.0"  # DON'T set to 1.0 in production, use a lower value like 0.1 or 0.01
  # Error tracking (GlitchTip): each binary sets its own project's SENTRY_DSN below
  SENTRY_ENVIRONMENT: "development"
  # JWT
  JWT_SECRET: "your-secret-key-change-in-production"
  JWT_TOKEN_EXPIRY: "15m"
  # Worker (cmd/worker)
  WORKER_MAX_RETRIES: "5"
  WORKER_RETRY_INITIAL: "1s"
  WORKER_RETRY_MAX: "30s"
  WORKER_ACK_WAIT: "5m"
  WORKER_SHUTDOWN_TIMEOUT: "10s"
  # Mail (cmd/worker sends it to Mailpit)
  SMTP_HOST: "mailpit"
  SMTP_PORT: "1025"
  MAIL_FROM: "Go Clean Template <noreply@example.com>"
  # Exchange rates (ExchangeRate-API open access)
  EXCHANGE_SERVICE_URL: "https://open.er-api.com"
  # WebAuthn (passkeys): Caddy, a dev server, and the app port the integration tests declare
  WEBAUTHN_RP_ID: "localhost"
  WEBAUTHN_RP_NAME: "Go Clean Template"
  WEBAUTHN_RP_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:8080"
  WEBAUTHN_CEREMONY_TIMEOUT: "5m"
  WEBAUTHN_REAUTH_MAX_AGE: "5m"
  # OIDC (SSO sign-in) against the keycloak service; see keycloak/realm.json
  OIDC_ISSUER: "http://keycloak.lvh.me:${KEYCLOAK_PORT:-8180}/realms/app"
  OIDC_CLIENT_ID: "go-clean-template"
  OIDC_CLIENT_SECRET: "go-clean-template-dev-secret"
  OIDC_ROLES_CLAIM: "realm_access.roles"
  OIDC_ROLE_MAP: "app-admin:admin,app-user:user"


services:
  db:
    image: postgres:18.6-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      # Host port from PG_PORT (.env): change it when something else on the host already uses 5432
      - "${PG_PORT:-5432}:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      app_network:
        aliases:
          - valkey.lvh.me

  mongo:
    image: mongo:9.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: "user"
      MONGO_INITDB_ROOT_PASSWORD: "mongoPa55w0rd"
    volumes:
      - mongo_data:/data/db
    ports:
      # Host port from MONGO_PORT (.env); MONGO_URL follows it
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      app_network:
        aliases:
          - mongo.lvh.me
  # The worker's queue: NATS with JetStream, its streams kept on a volume.
  nats:
    image: nats:2.15.2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      app_network:
        aliases:
          - nats.lvh.me

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      app_network:
        aliases:
          - jaeger.lvh.me

  # SMTP sink for development: catches every email the worker sends. Host ports follow SMTP_PORT and
  # MAILPIT_UI_PORT (1025 and 8025 by default).
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${SMTP_PORT:-1025}:1025"          # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"    # Web UI and API
    networks:
      app_network:
        aliases:
          - mailpit.lvh.me

  # OIDC provider for SSO sign-in. One issuer URL everywhere: keycloak.lvh.me resolves to 127.0.0.1 on
  # the host and to this container on app_network, and Keycloak listens on KEYCLOAK_PORT (8180) on
  # both sides.
  # Dev users: alice/alice (app-admin), bob/bob (app-user); admin console: admin/admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: "${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME: "http://keycloak.lvh.me:${KEYCLOAK_PORT:-8180}"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:${KEYCLOAK_PORT:-8180}"
    healthcheck:
      # The image has no curl; ask the management port's readiness endpoint over bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      app_network:
        aliases:
          - keycloak.lvh.me

  app:
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
      SENTRY_DSN: "${SENTRY_APP_DSN:-}"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_started
      jaeger:
        condition: service_started
      valkey:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  # Projections and the queue consumer (NATS JetStream): the app image, started on its /worker entry point
  worker:
    platform: linux/amd64
    build:
      context: .
    command: ["/worker"]
    # The worker does not wait for Postgres the way the app's schema sync does; retry until it is up.
    restart: on-failure
    environment:
      <<: *x-backend-app-environment
      SENTRY_DSN: "${SENTRY_WORKER_DSN:-}"
    depends_on:
      db:
        condition: service_started
      jaeger:
        condition: service_started
      mailpit:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - worker.lvh.me

  caddy:
    build:
      context: ./caddy
      # The web client's source, for the stage that builds it (narrowed by web/.dockerignore).
      additional_contexts:
        web-src: ./web
    ports:
      - "80:80"
    depends_on:
      - app
      - jaeger
    networks:
      app_network:
        ipv4_address: 172.30.0.10
        aliases:
          - caddy.lvh.me


networks:
  app_network:
    external: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come from .128 up, so none takes Caddy's .10.
          ip_range: 172.30.0.128/25


volumes:
  db_data:
  mongo_data:
  nats_data:
