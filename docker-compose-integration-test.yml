services:
  # Stands in for translate.google.com so the translation tests do not hit Google's rate limits.
  translate:
    container_name: translate
    image: caddy:2.11.7-alpine
    volumes:
      - ./integration-test/translate-stub/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      app_network:
        aliases:
          - translate.lvh.me

  app:
    environment:
      TRANSLATION_SERVICE_URL: "translate:8443"
    depends_on:
      - translate

  integration-test:
    container_name: integration-test
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    environment:
      # Read by queue_test.go to check what the worker consumed.
      PG_URL: "postgres://user:myAwEsOm3pa55%40w0rd@db:5432/db?sslmode=disable"
    depends_on:
      - app
      - worker
      - mailpit
    networks:
      app_network:
        aliases:
          - test.lvh.me


networks:
  app_network:
    external: false
