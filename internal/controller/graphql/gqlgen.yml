schema:
  - schema/*.graphqls

exec:
  package: generated
  layout: follow-schema
  dir: generated
  filename_template: "{name}.generated.go"

model:
  package: model
  filename: model/models_gen.go

# No resolver section: gqlgen writes no resolver code. Each domain's resolvers are hand-written in
# their own folder (task/, exchange/) and joined in resolver.go; a schema field nobody resolves
# fails the build with "missing method <Field>".

omit_slice_element_pointers: true
omit_getters: true

# A schema type binds to the entity type of the same name, so a domain's read shape (Task) needs no
# entry below. The entries are the types autobind would get wrong.
autobind:
  - github.com/m7medvision/go-clean-template/internal/entity

models:
  # entity.Conversion holds decimals, which GraphQL carries as strings: gqlgen generates
  # model.Conversion, and the exchange resolver converts.
  Conversion:
    forceGenerate: true
  TaskStatus:
    model: github.com/m7medvision/go-clean-template/internal/entity.TaskStatus
    enum_values:
      TODO:
        value: github.com/m7medvision/go-clean-template/internal/entity.TaskStatusTodo
      IN_PROGRESS:
        value: github.com/m7medvision/go-clean-template/internal/entity.TaskStatusInProgress
      DONE:
        value: github.com/m7medvision/go-clean-template/internal/entity.TaskStatusDone
