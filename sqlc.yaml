version: "2"
sql:
  - engine: postgresql
    schema: internal/repo/persistent/queries/schema/schema.sql
    queries: internal/repo/persistent/queries
    gen:
      go:
        package: queries
        out: internal/repo/persistent/queries
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - column: tasks.status
            go_type: github.com/m7medvision/go-clean-template/internal/entity.TaskStatus
          - column: tasks.description
            go_type: string
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - column: exchange_history.rate_date
            go_type: time.Time
          - column: queue_messages.body
            go_type: encoding/json.RawMessage
