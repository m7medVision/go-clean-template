version: "2"
sql:
  - engine: postgresql
    schema: internal/app/migrations
    queries: internal/repo/persistent/queries
    gen:
      go:
        package: queries
        out: internal/repo/persistent/queries
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - column: tasks.status
            go_type: github.com/m7medvision/go-clean-template/internal/entity.TaskStatus
          - column: tasks.description
            go_type: string
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - column: exchange_history.rate_date
            go_type: time.Time
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - column: webauthn_credentials.id
            go_type: github.com/m7medvision/go-clean-template/internal/entity.PasskeyID
          - column: webauthn_credentials.credential
            go_type: encoding/json.RawMessage
          - column: events.payload
            go_type: encoding/json.RawMessage
          - column: events.metadata
            go_type: encoding/json.RawMessage
          - column: snapshots.payload
            go_type: encoding/json.RawMessage
